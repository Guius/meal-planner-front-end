<app-header title="Meal Planner / User Preferences"></app-header>
<ion-content>
  <!-- Loading skeleton -->
  <div *ngIf="isLoading" class="loading-skeleton">
    <div class="skeleton-item">
      <ion-skeleton-text
        animated
        style="width: 100%; height: 60px; border-radius: 8px"
      ></ion-skeleton-text>
    </div>
    <div class="skeleton-item">
      <ion-skeleton-text
        animated
        style="width: 100%; height: 60px; border-radius: 8px"
      ></ion-skeleton-text>
    </div>
    <div class="skeleton-item">
      <ion-skeleton-text
        animated
        style="width: 100%; height: 60px; border-radius: 8px"
      ></ion-skeleton-text>
    </div>
  </div>

  <!-- Diet options -->
  <app-multiple-choice
    *ngIf="!isLoading"
    [items]="dietOptions"
    (multipleChoiceSaved)="saveDiets($event)"
    class="flex-1"
  >
  </app-multiple-choice>
</ion-content>
