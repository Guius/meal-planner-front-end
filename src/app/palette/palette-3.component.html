<!-- Mobile Layout -->
<div *ngIf="isMobile" class="mobile-layout">
  <p class="platform-message mobile">I'm on mobile</p>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Mobile Experience</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      This content is specifically designed for mobile devices. The layout is
      optimized for touch interactions and smaller screens.
    </ion-card-content>
  </ion-card>
</div>

<!-- Desktop Layout -->
<div *ngIf="isDesktop" class="w-full overflow-auto">
  <app-header title="Meal Planner / Palette"></app-header>
  <div class="flex flex-col px-10 py-5 bg-app_grey">
    <section class="flex justify-between items-center border h-24">
      <app-subtitle subtitle="Build your menu"></app-subtitle>
      <app-form-button text="View your selection"></app-form-button>
    </section>
    <section class="w-full flex flex-col border h-fit">
      <div class="flex justify-center w-full">
        <app-select-label
          align="centre"
          label="Select your recipes"
          class="w-1/2"
        ></app-select-label>
      </div>
      <div class="grow flex flex-col justify-center">
        <div class="flex gap-10 overflow-x-scroll justify-start">
          <app-recipe-card
            *ngFor="let recipe of paletteRecipes; let i = index"
            [recipe]="recipe"
            class="mb-5"
          ></app-recipe-card>
        </div>
      </div>
    </section>
    <section class="w-full border">
      <div class="flex justify-center w-full">
        <app-select-label
          align="centre"
          label="Don't like what you see?"
          class="w-1/2"
        ></app-select-label>
      </div>
      <div class="flex justify-center items-center mt-14">
        <app-form-button
          text="See different recipes"
          class="mx-4"
        ></app-form-button>
        <app-form-button
          text="Change user preferences"
          class="mx-4"
        ></app-form-button>
      </div>
    </section>
  </div>
</div>

<!-- Fallback for other platforms -->
<div *ngIf="!isMobile && !isDesktop" class="unknown-layout">
  <p class="platform-message unknown">Platform unknown</p>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Unknown Platform</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      This is a fallback layout for unrecognized platforms.
    </ion-card-content>
  </ion-card>
</div>
