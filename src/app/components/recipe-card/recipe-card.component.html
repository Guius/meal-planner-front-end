<div class="flex flex-col w-72 border h-3/4">
  <div class="bg-red flex flex-col justify-center flex-1">
    <h3
      class="font-ubunutu_sans_mono uppercase m-5 text-2xl overflow-hidden whitespace-nowrap text-ellipsis"
    >
      {{ this.recipe.recipeName }}
    </h3>
  </div>
  <div class="bg-yellow overflow-y-scroll flex-1">
    <p class="font-kalam m-5 text-base">
      {{ this.recipe.simplifiedIngredientsList }}
    </p>
  </div>
  <div class="h-10 flex-none">
    <button
      (click)="buttonClicked()"
      class="w-full bg-button_bg hover:bg-button_bg_hover active:bg-button_bg_active focus:bg-button_bg_focus disabled:bg-button_bg_disabled rounded-none py-2 px-8 font-ubunutu_sans_mono uppercase transition-colors duration-150"
    >
      Add to selection
    </button>
  </div>
</div>
