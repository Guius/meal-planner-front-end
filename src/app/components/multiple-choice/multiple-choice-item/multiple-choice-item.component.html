<ion-chip (click)="toggleItemSelected()" class="mr-5" [disabled]="disabled">
  <div class="pl-5 pr-5 mr-">
    <ion-label *ngIf="!isLoading">{{
      this.multipleChoiceItem.label
    }}</ion-label>
    <ion-skeleton-text
      *ngIf="isLoading"
      animated
      style="width: 80px; height: 16px; border-radius: 4px"
    >
    </ion-skeleton-text>
    <ion-icon
      *ngIf="!isLoading"
      src="./../../../../assets/icon/tick.svg"
      [class.icon-hidden]="!this.multipleChoiceItem.selected"
    ></ion-icon>
  </div>
</ion-chip>
