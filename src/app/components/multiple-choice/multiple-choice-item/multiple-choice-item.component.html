<ion-chip (click)="toggleItemSelected()" class="mr-5">
  <div class="pl-5 pr-5 mr-">
    <ion-label>{{ this.multipleChoiceItem.label }}</ion-label>
    <ion-icon
      src="./../../../../assets/icon/tick.svg"
      [class.icon-hidden]="!this.multipleChoiceItem.selected"
    ></ion-icon>
  </div>
</ion-chip>
